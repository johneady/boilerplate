# Local verification stack for the application.
#
# This mirrors what Dokploy runs (docker-compose.dokploy.yml) so problems
# surface locally. Nothing in THIS file may ever touch production: it embeds a
# throwaway APP_KEY, a well-known database password and a published port, all
# safe only because this stack is local and disposable.
#
# ALWAYS pass --env-file .env.docker. Compose's default variable file is the
# project-root .env, which here is the application's OWN Laravel .env -- so a
# bare `docker compose up` interpolates that file's values (APP_PORT, APP_URL,
# anything sharing a name) into this throwaway stack without saying so.
#
#   cp .env.docker.example .env.docker      # first time only
#   docker compose --env-file .env.docker up --build -d
#   docker compose --env-file .env.docker logs -f app
#   open http://localhost:8011              # or APP_PORT from .env.docker

x-app-base: &app-base
  build:
    context: .
    target: runtime
  image: boilerplate:local
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
  environment: &app-env
    APP_NAME: "Boilerplate"
    APP_ENV: production
    # Local-only throwaway key (a valid randomly generated one — Laravel needs
    # 32 base64-decodable bytes and SESSION_ENCRYPT=true). The real one is set
    # per Dokploy application.
    APP_KEY: base64:k0jmGEgk6TEVoISp1Phks72LzifX97MhYaVusSPmb+Q=

    # Defined ONLY in .env.docker, so this fails fast when --env-file is
    # forgotten. Without it Compose falls back to the project-root .env -- the
    # application's own Laravel env -- and quietly runs this throwaway stack on
    # those values. The variable is unused; the guard is the point.
    DOCKER_LOCAL_STACK: ${DOCKER_LOCAL_STACK:?pass --env-file .env.docker (see this file's header, and .env.docker.example)}

    APP_DEBUG: "false"
    APP_URL: http://localhost:${APP_PORT:-8011}

    APP_LOCALE: en
    APP_FALLBACK_LOCALE: en
    APP_FAKER_LOCALE: en_US
    APP_MAINTENANCE_DRIVER: file
    BCRYPT_ROUNDS: "12"

    LOG_CHANNEL: stack
    LOG_STACK: single
    LOG_LEVEL: debug

    # MariaDB, matching the Dokploy-managed database.
    DB_CONNECTION: mariadb
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_DATABASE: boilerplate
    DB_USERNAME: boilerplate
    DB_PASSWORD: secret

    SESSION_DRIVER: database
    SESSION_LIFETIME: "120"
    SESSION_ENCRYPT: "true"
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    BROADCAST_CONNECTION: log
    FILESYSTEM_DISK: local

    MAIL_MAILER: log
    MAIL_FROM_ADDRESS: hello@example.com
    MAIL_FROM_NAME: "Boilerplate"

    # Overridden per service below. The web role owns migrations and seeding;
    # worker and scheduler containers force both off in the entrypoint whatever
    # is set here, and wait for the web container's schema before starting.
    CONTAINER_ROLE: app
    RUN_MIGRATIONS: "true"
    # Seeding is idempotent, so this stays safe across redeploys.
    RUN_SEEDERS: "true"

  volumes:
    - storage-logs:/var/www/html/storage/logs

services:
  # MariaDB, matching the Dokploy production database. Pinned to 11.8 rather
  # than a floating tag: a minor upgrade should be a decision, patch releases
  # are fine. The service keeps the name "mysql" so DB_HOST is unchanged.
  mysql:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: boilerplate
      MARIADB_USER: boilerplate
      MARIADB_PASSWORD: secret
      MARIADB_ROOT_PASSWORD: rootsecret
    ports:
      # Exposed only for local inspection; Dokploy keeps this internal.
      - "127.0.0.1:33063:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    <<: *app-base
    ports:
      # 8010 is the host dev server; this stack defaults to 8011.
      - "${APP_PORT:-8011}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/up || exit 1"]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Queue worker. Same image and environment as the web role, different
  # CONTAINER_ROLE -- the entrypoint picks the supervisor program set from it.
  worker:
    <<: *app-base
    environment:
      <<: *app-env
      CONTAINER_ROLE: worker
    # The image HEALTHCHECK curls nginx, which this role does not run -- without
    # an override the container reports "unhealthy" while working perfectly.
    #
    # Ask supervisor for the managed process's state rather than grepping
    # /proc: the healthcheck itself runs as `sh -c "... queue:work ..."`, so any
    # grep over /proc/*/cmdline matches its OWN command line and can never
    # fail. supervisorctl reports RUNNING only for a process that is genuinely
    # up, and returns non-zero once it has died or backed off.
    healthcheck:
      test: ["CMD-SHELL", "supervisorctl status queue-worker | grep -q RUNNING || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
    # Waits for the app container's migrations before its first query; see the
    # entrypoint. depends_on only orders starts, it does not wait for readiness.
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started

  # Scheduler. Exactly one replica -- instances do not divide work between them,
  # they each fire every due task. See docker/entrypoint/supervisord.scheduler.conf.
  scheduler:
    <<: *app-base
    environment:
      <<: *app-env
      CONTAINER_ROLE: scheduler
    # As with the worker: the image HEALTHCHECK curls nginx, which this role does
    # not run, and a /proc grep would match the healthcheck's own command line.
    # Ask supervisor whether the scheduler process is actually up.
    healthcheck:
      test: ["CMD-SHELL", "supervisorctl status scheduler | grep -q RUNNING || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started

volumes:
  mysql-data:
  storage-logs:
