# Dokploy deployment stack for the application.
#
# Deploy THIS file, not docker-compose.yml (that one is a local verification
# stack with an embedded throwaway APP_KEY, a known database password and a
# published port).
#
# Everything instance-specific comes from
# the Dokploy application's own environment settings; a missing one fails the
# deploy with a named error instead of booting on a silent default.
#
# Differences from the local stack, all deliberate:
#   - no database service    — Dokploy manages MariaDB
#   - no published ports     — Traefik reaches the app on the internal network
#   - no literal secrets     — every setting comes from Dokploy's environment
#   - pulls, never builds    — the image comes from GHCR, built by CI; see the
#                              comment on x-app-base below for why

x-app-base: &app-base
  # PULLED, not built. There is deliberately no `build:` key here: compiling
  # the PHP extensions is ~6 minutes of cc, and doing that on the deploy host
  # makes every deploy compete with production for RAM on a box that is already
  # running the app. That is an OOM waiting to happen, and BuildKit reports an
  # OOM as the build process dying rather than as a step failing, so it reads
  # like a broken Dockerfile instead of an exhausted host.
  #
  # .github/workflows/docker.yml builds and pushes this image on every push to
  # main (and to demo/* branches, tagged demo-<slug>; see docker/new-demo.sh).
  # The bytes CI built and tested are the bytes that run here.
  #
  # IMAGE_TAG must name a tag that workflow published. Prefer an immutable one
  # -- `sha-<full-commit-sha>`, or a `v*` release tag -- over `latest`: `latest`
  # moves under you, so a container restart can quietly pull a different build
  # than the one you deployed, and nothing records which. Set it in the Dokploy
  # environment; it defaults to latest only so a first deploy works.
  #
  # The package is private by default, so Dokploy needs a GHCR registry
  # credential (a PAT with read:packages) to pull it. Without one the deploy
  # fails on `docker pull` with "denied", before any container starts.
  image: ghcr.io/${GHCR_REPOSITORY:?set GHCR_REPOSITORY in Dokploy (owner/repo, lowercase)}:${IMAGE_TAG:-latest}
  # Always re-pull on deploy: with a moving tag, Docker would otherwise keep
  # using the copy already on disk and "redeploy" would change nothing.
  pull_policy: always
  restart: unless-stopped

  environment: &app-env
    APP_NAME: ${APP_NAME:-Boilerplate}

    # Defaults to production. Override in Dokploy for a staging instance --
    # but read app/Providers/AppServiceProvider.php first: 'local' and
    # 'testing' drop the password policy, let AdminUserSeeder accept
    # admin@example.com / password, re-enable destructive artisan commands
    # (migrate:fresh, db:wipe) against this database, and switch on the
    # passwordless dev login. Prefer 'staging', which keeps every guard on.
    APP_ENV: ${APP_ENV:-production}

    # Generate once with `php artisan key:generate --show` and reuse across
    # redeploys: SESSION_ENCRYPT is true, so a changed key logs every user out.
    APP_KEY: ${APP_KEY:?set APP_KEY in Dokploy (php artisan key:generate --show)}

    # Deliberately a literal, not overridable: a stack trace on a public 500
    # page leaks APP_KEY, database and mail credentials, and a forgotten
    # APP_DEBUG=true in a Dokploy env is far too cheap a mistake. Debug a
    # deployed instance from the logs, or edit this line knowingly.
    APP_DEBUG: "false"

    # Must be the https:// domain Traefik serves for this instance. It is the
    # base for every generated URL.
    APP_URL: ${APP_URL:?set APP_URL in Dokploy (https://<domain>)}

    APP_LOCALE: en
    APP_FALLBACK_LOCALE: en
    APP_FAKER_LOCALE: en_US
    APP_MAINTENANCE_DRIVER: file
    BCRYPT_ROUNDS: "12"

    # Traefik terminates TLS and forwards plain HTTP, so without this Laravel
    # reads requests as insecure and generates http:// URLs, which browsers
    # block as mixed content. Safe here because only Traefik can reach the
    # container — nothing is published.
    TRUST_PROXIES: "*"

    # 'daily' rather than 'single', because nothing rotates the log inside a
    # container: a single file grows for the life of the volume until it fills
    # the disk. Daily files are capped at LOG_DAILY_DAYS and the oldest is
    # deleted as each new one opens. Logging stays on a file rather than
    # stderr so `php artisan pail` and Boost's log reader work against a
    # deployed instance, and so retention does not depend on how the host's
    # Docker log driver happens to be configured.
    LOG_CHANNEL: stack
    LOG_STACK: daily
    LOG_DAILY_DAYS: ${LOG_DAILY_DAYS:-14}
    LOG_LEVEL: ${LOG_LEVEL:-warning}

    # Dokploy provisions MariaDB, so DB_CONNECTION is 'mariadb', NOT 'mysql'.
    # Laravel has a dedicated MariaDB driver and the two are not
    # interchangeable for DDL generation. The schema itself is portable (the
    # suite runs on SQLite locally and MariaDB here).
    DB_CONNECTION: ${DB_CONNECTION:-mariadb}
    DB_HOST: ${DB_HOST:?set DB_HOST in Dokploy (the managed MariaDB host, not localhost)}
    DB_PORT: ${DB_PORT:-3306}
    DB_DATABASE: ${DB_DATABASE:?set DB_DATABASE in Dokploy}
    DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME in Dokploy}
    DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in Dokploy}

    SESSION_DRIVER: ${SESSION_DRIVER:-database}
    SESSION_LIFETIME: "120"
    SESSION_ENCRYPT: "true"
    # Behind TLS-terminating Traefik, the session cookie must carry the
    # Secure attribute so it is never sent over plain HTTP.
    SESSION_SECURE_COOKIE: "true"
    # All three default to `database`, which needs no extra service: the
    # managed MariaDB above carries them, and app:prune-expired-storage sweeps
    # what those drivers leave behind.
    #
    # To move to Redis: provision one in Dokploy (the same way MariaDB is
    # provisioned -- it joins dokploy-network, so REDIS_HOST is its service
    # name), set the REDIS_* variables below in the Dokploy environment, and
    # change these to `redis`. The image already carries phpredis, so this is
    # an env change and a redeploy, not an image rebuild.
    #
    # Self-hosting it instead means adding a `redis` service to this file --
    # ABOVE `app`, never below, for the Traefik-label reason documented there
    # -- with a persistent volume and `--appendonly yes`. A Redis that loses
    # its data on restart logs every user out when SESSION_DRIVER=redis.
    CACHE_STORE: ${CACHE_STORE:-database}
    QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}

    # Consulted only when one of the drivers above is set to `redis`. Left
    # unset otherwise -- config/database.php supplies the defaults, and naming
    # a host here that does not exist would be a trap waiting for the flip.
    REDIS_CLIENT: ${REDIS_CLIENT:-phpredis}
    REDIS_HOST: ${REDIS_HOST:-127.0.0.1}
    REDIS_PORT: ${REDIS_PORT:-6379}
    REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
    BROADCAST_CONNECTION: log
    FILESYSTEM_DISK: local

    MAIL_MAILER: ${MAIL_MAILER:-log}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
    MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Boilerplate}
    # Unset unless MAIL_MAILER=smtp. Without these forwarded, setting
    # MAIL_MAILER=smtp yields a container with SMTP selected and no server to
    # send through, which fails only at the first send.
    MAIL_HOST: ${MAIL_HOST:-}
    MAIL_PORT: ${MAIL_PORT:-587}
    MAIL_USERNAME: ${MAIL_USERNAME:-}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    MAIL_SCHEME: ${MAIL_SCHEME:-smtp}

    # Overridden per service below. The web role owns migrations and seeding;
    # worker and scheduler containers force both off in the entrypoint whatever
    # is set here, and wait for the web container's schema before starting.
    CONTAINER_ROLE: app
    RUN_MIGRATIONS: "true"

    # Seeds the demo accounts so the instance is usable the moment it is up.
    # Idempotent: the admin seeder promotes an existing account rather than
    # resetting it, and the demo user is skipped once present, so leaving this
    # true across redeploys never resets a password you have since changed.
    #
    # The credentials are fixed and public (config/first.php) -- there is
    # nothing to configure here, and nothing to forget.
    RUN_SEEDERS: ${RUN_SEEDERS:-true}

  # Must join dokploy-network, the shared network the Dokploy-managed MariaDB
  # lives on. Without this, Compose puts the service on a project default
  # network and the app cannot reach the database at all.
  networks:
    - dokploy-network

  # ALL THREE roles mount the SAME storage volumes, and both upload disks are
  # volumes rather than image layers. Each of those is load-bearing for a
  # different reason:
  #
  #   storage/app/private and storage/app/public are where uploads actually
  #   land -- config/filesystems.php points the `local` disk at the first and
  #   the `public` disk at the second, and App\Media\MediaCollection::disk()
  #   resolves to one or the other for every collection. Without a volume they
  #   are ordinary image-layer directories, so `pull_policy: always` plus a new
  #   IMAGE_TAG DELETES every uploaded file on each deploy. The media rows
  #   survive in MariaDB, so the app returns with a full catalogue pointing at
  #   files that are gone -- broken images rather than an error anyone notices.
  #
  #   Sharing them across roles is what makes image processing work at all.
  #   App\Jobs\ProcessUploadedImage reads its source from Storage::disk('local')
  #   -- a file the WEB container wrote. On unshared per-container filesystems
  #   the worker looks for it on its own disk, never finds it, and every
  #   conversion fails while both containers report healthy.
  #
  # The cost of local named volumes is that they are per-HOST, so this pins the
  # three roles to one machine. That is already true of single-node Dokploy. The
  # moment a second node is involved, these must become shared object storage --
  # config/filesystems.php already carries an `s3` disk, so that is a matter of
  # setting FILESYSTEM_DISK/IMAGE_DISK and the AWS_* variables, not new code.
  volumes:
    - storage-logs:/var/www/html/storage/logs
    - storage-app-private:/var/www/html/storage/app/private
    - storage-app-public:/var/www/html/storage/app/public

  # Hard memory ceiling: a runaway process kills its own container (restarted by
  # Docker) instead of the host.
  #
  # Sized for the WEB role: pm.max_children = 6 * ~60MB worker RSS +
  # nginx/php-fpm/opcache overhead stays comfortably under this cap. The
  # scheduler runs a single PHP process and sits far below it.
  #
  # The worker OVERRIDES this to 768m -- see the comment on that service for
  # why image decoding makes it the one role a web-sized cap does not fit.
  # Anything else inheriting from this base gets the web figure.
  #
  # Raising pm.max_children or php.ini's memory_limit means raising this too.
  mem_limit: 512m

services:
  # NOTE: `app` is deliberately the LAST service in this file -- see the comment
  # above it. Add new non-web services ABOVE it, never below.

  # Queue worker. Same image and environment as the web role, different
  # CONTAINER_ROLE -- the entrypoint selects the supervisor program set from it.
  #
  # Scale with `deploy.replicas` or by duplicating this service: workers on the
  # same queue coordinate through the database, so extra processes are safe.
  worker:
    <<: *app-base
    # Overrides the shared 512m, which is sized for the WEB role's php-fpm pool
    # and has nothing to do with what a worker actually needs.
    #
    # The worker's steady state is far below 512m -- a single PHP process that
    # self-recycles at --memory=192. The spike is App\Jobs\ProcessUploadedImage:
    # gd decodes a JPEG to a RAW BITMAP, so peak memory tracks the image's
    # PIXEL count and has almost nothing to do with its file size.
    #
    # Measured in this container, not estimated: a 6000x4000 photo (24 MP) is
    # 0.36 MB on disk and costs 190 MB to decode. config/images.php caps
    # uploads at 5120 KB, which sounds protective and is not -- JPEG
    # compression means that ceiling admits images of essentially unbounded
    # dimensions, and nothing validates DIMENSIONS anywhere. A 12000x9000
    # (108 MP) file measures 4.72 MB, passes validation, and then exhausts a
    # 1 GB limit outright.
    #
    # So 768m is headroom for the ordinary case (a phone photo at 12-50 MP),
    # NOT a guarantee. The real fix is a megapixel cap at validation time, so
    # the job never decodes something it cannot hold; raising this number just
    # moves the cliff. Until then the failure is contained: the OOM kills this
    # container, Docker restarts it, and the web tier is untouched.
    #
    # Getting OOM-killed is worse than it first looks. The kill is a SIGKILL
    # from outside the container's control, so it bypasses the entire graceful
    # shutdown contract the worker role is built around -- stopsignal=TERM and
    # stopwaitsecs=90 buy nothing against it, the job dies mid-write, and it is
    # retried only once retry_after elapses.
    mem_limit: 768m
    environment:
      <<: *app-env
      CONTAINER_ROLE: worker
    # The image HEALTHCHECK curls nginx, which this role does not run -- without
    # an override the container reports "unhealthy" while working perfectly.
    #
    # Ask supervisor for the managed process's state rather than grepping
    # /proc: the healthcheck itself runs as `sh -c "... queue:work ..."`, so any
    # grep over /proc/*/cmdline matches its OWN command line and can never
    # fail. supervisorctl reports RUNNING only for a process that is genuinely
    # up, and returns non-zero once it has died or backed off.
    healthcheck:
      test: ["CMD-SHELL", "supervisorctl status queue-worker | grep -q RUNNING || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      app:
        condition: service_started

  # Scheduler. MUST stay at exactly one replica: scheduler instances do not
  # divide work between them, they each fire every due task. The tasks in
  # routes/console.php carry onOneServer() as a backstop, not a licence to
  # scale this service.
  scheduler:
    <<: *app-base
    environment:
      <<: *app-env
      CONTAINER_ROLE: scheduler
    # As with the worker: the image HEALTHCHECK curls nginx, which this role does
    # not run, and a /proc grep would match the healthcheck's own command line.
    # Ask supervisor whether the scheduler process is actually up.
    healthcheck:
      test: ["CMD-SHELL", "supervisorctl status scheduler | grep -q RUNNING || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      app:
        condition: service_started

  # ORDER MATTERS: `app` must be the LAST service in this file.
  #
  # Dokploy injects the Traefik routing labels for the application's domain by
  # appending a `labels:` block to the last service it finds. With `scheduler`
  # or `worker` last, those labels land on a container that runs no web server,
  # so Traefik routes the domain at nothing listening on port 80 and every
  # request returns 502 while every container still reports healthy.
  app:
    <<: *app-base
    # No ports. Traefik routes to port 80 over Dokploy's network; publishing
    # here would expose the app directly, bypassing TLS — and Docker's iptables
    # rules sit ahead of UFW, so the firewall would not stop it.
    expose:
      - "80"
    healthcheck:
      # /up, NOT /health, and that is deliberate. /health resolves the
      # database, cache and queue-worker heartbeat; restarting on it would
      # mean a brief database blip cycles every web container at once, taking
      # the site down harder and for longer than the blip did. Docker restarts
      # on "this container is broken", which is what /up answers.
      #
      # Point an external uptime monitor at /health instead: it reports which
      # dependency is degraded and returns 503, without any power to restart
      # anything. See config/health.php.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/up || exit 1"]
      # 120s, not 30s: /up boots the full Laravel framework, so a 30s interval
      # burns real CPU for no extra signal. Docker still marks the container
      # unhealthy within retries*interval (~6 min).
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  storage-logs:
  # The upload disks. See the comment on x-app-base's volumes for why these
  # must exist and must be shared by all three roles.
  storage-app-private:
  storage-app-public:

# Created by the Dokploy installer; the managed database is attached to it.
networks:
  dokploy-network:
    external: true
