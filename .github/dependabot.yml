version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    groups:
      # Laravel's first-party packages release together and are tested
      # together; separate PRs for each just multiply CI runs on changes that
      # have to land as a set anyway.
      laravel:
        patterns:
          - laravel/*
          - livewire/*
          - filament/*
      dev-tooling:
        dependency-type: development
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      build-tooling:
        patterns:
          - vite
          - vite-plus
          - laravel-vite-plugin
          - '@tailwindcss/*'
          - tailwindcss
      dev-tooling:
        dependency-type: development
        patterns:
          - '*'
    # playwright is held back deliberately. Its npm version must match a
    # chromium build already in ~/.cache/ms-playwright, because the browser CDN
    # can be blocked here and the plugin refuses to run against a mismatched
    # build (1.62.0 -> chromium-1234, 1.61.0 -> 1228). See .ai/rules/browser.md.
    #
    # CI is unaffected -- it runs `npx playwright install` after `npm ci` and
    # downloads whatever the installed version wants -- so an automatic bump
    # breaks LOCAL browser testing only, which is the quiet failure this avoids:
    # green CI, red laptop. Bump it by hand together with the cached browser.
    #
    # Note this must be an `ignore`, not a group `exclude-patterns`: excluding it
    # from the dev-tooling group would only stop it being BUNDLED, and Dependabot
    # would still raise a PR for it on its own.
    ignore:
      - dependency-name: playwright

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # Pinned base images in the Dockerfile (php:8.5-*, node:22-*) go stale
  # silently otherwise -- nothing else in the repo reports a new patch release
  # of the runtime the deployed image is built on.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
