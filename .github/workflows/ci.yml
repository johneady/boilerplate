name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-analysis:
    name: Pint & PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, zip, gd, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      # The Dockerfile's node: base and the node-version pins in this file are
      # independent -- nothing else fails when they drift apart, which is
      # exactly how they drifted before (CI unpinned while the Dockerfile moved
      # to a non-LTS line). Assert they agree so the drift is a red build
      # rather than a silent difference between CI and the deployed image.
      - name: Check Node pins agree
        run: |
          dockerfile_node="$(grep -oP '^FROM node:\K[0-9]+' Dockerfile | sort -u)"
          workflow_nodes="$(grep -oP "node-version: '\K[0-9]+" .github/workflows/ci.yml | sort -u)"

          if [ -z "$dockerfile_node" ] || [ -z "$workflow_nodes" ]; then
            echo "::error::Could not find a Node pin in Dockerfile and/or ci.yml."
            exit 1
          fi

          all="$(printf '%s\n%s\n' "$dockerfile_node" "$workflow_nodes" | sort -u)"
          if [ "$(printf '%s\n' "$all" | wc -l)" -ne 1 ]; then
            echo "::error::Node pins disagree. Dockerfile=[$(echo $dockerfile_node)] ci.yml=[$(echo $workflow_nodes)]"
            exit 1
          fi

          echo "Node pin consistent: $all"

      - name: Check code style
        run: vendor/bin/pint --test --parallel

      - name: Analyse types
        run: vendor/bin/phpstan analyse --no-progress

  format:
    name: Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # The stylesheets, scripts and Vite config only; .prettierrc holds the
      # house style. Blade is not formatted: prettier-plugin-blade would rewrite
      # every view in one pass, which is a change to make deliberately rather
      # than as a side effect of a CI gate.
      - name: Check formatting
        run: npm run format:check

  tests:
    name: Pest (sqlite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Tia diffs the branch against its baseline, so it needs history
          # rather than the default depth-1 checkout to resolve origin/main.
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, zip, gd, sqlite3, pdo_sqlite
          # Tia records which tests touch which files through a coverage
          # driver, and it requires PCOV specifically.
          coverage: pcov
          tools: composer:v2

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Set up environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Vite+ requires a modern Node (vite-plus declares
      # ^20.19.0 || ^22.18.0 || >=24.11.0). Pinning to the current LTS keeps CI,
      # the Dockerfile and local development on one version rather than
      # inheriting whatever the runner image happens to ship.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Run tests
        # Pest's environment defaults to LOCAL and only becomes CI when --ci is
        # passed, which makes it run the full suite instead of trusting Tia's
        # cached dependency graph. `artisan test` does not forward the flag, so
        # Pest is invoked directly.
        #
        # Browser tests are excluded here and run in their own job: they need a
        # Playwright browser download this job has no reason to pay for, and
        # keeping them apart stops browser flakiness from masking a real unit
        # or feature failure.
        run: vendor/bin/pest --ci --parallel --testsuite=Unit,Feature

  browser:
    name: Pest (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Separate from the Pest job above so the fast feedback loop stays fast:
    # this one downloads a browser and drives a real page, which is both slower
    # and likelier to fail for reasons unrelated to the change under test.
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, zip, gd, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Set up environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # The plugin drives Playwright from node_modules and refuses to run
      # against a browser build that does not match the installed version, so
      # the browser must match the playwright npm package npm ci just installed.
      # That is why the cache key is the resolved version rather than the
      # lockfile hash: an unrelated lockfile change must not invalidate a
      # still-correct browser, and a playwright bump must invalidate it.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # Chromium is a ~275MB (compressed) download that changes only when the
      # playwright package does, so it is the single most worthwhile thing to
      # cache in this workflow -- a cold install measured ~54s locally.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # On a cache hit the binaries are already restored and only the OS-level
      # shared libraries are missing, so the multi-hundred-megabyte browser
      # download is skipped and just the apt packages are installed.
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build assets
        run: npm run build

      - name: Run browser tests
        run: vendor/bin/pest --ci --testsuite=Browser

      # The plugin writes a screenshot beside each failing assertion, which is
      # usually the fastest way to see why a browser test failed in CI.
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-screenshots
          path: tests/Browser/Screenshots
          if-no-files-found: ignore

  database:
    name: Pest (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The sqlite job above is the fast feedback loop; this one is the honest
    # one. Production runs MySQL or MariaDB (the Dockerfile installs
    # pdo_mysql), and sqlite silently tolerates things a real server rejects:
    # looser typing, no strict-mode errors on overlong or invalid values, and
    # different behaviour around transactional DDL and index name limits. A
    # green sqlite suite is not evidence the deployed database agrees.
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mysql
            image: mysql:8.4
          - database: mariadb
            image: mariadb:11

    services:
      database:
        image: ${{ matrix.image }}
        env:
          # Both images read the MYSQL_* names; MariaDB accepts them as
          # aliases for its own MARIADB_* variables.
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized || mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, zip, gd, mysqli, pdo_mysql
          coverage: pcov
          tools: composer:v2

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Set up environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Run tests
        # phpunit.xml pins DB_CONNECTION=sqlite and DB_DATABASE=:memory: in its
        # <php> block, but PHPUnit's <env> elements do not overwrite a variable
        # that is already set in the process environment (only force="true"
        # does), so setting them here wins. DB_URL is blanked for the same
        # reason: phpunit.xml sets it empty, and a non-empty DB_URL would take
        # precedence over the host and port below.
        env:
          DB_CONNECTION: ${{ matrix.database }}
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: root
          DB_URL: ''
        # Browser tests are excluded: this job installs no Playwright browser,
        # and what it exists to prove is that the schema and queries behave on
        # a real database server -- which the Unit and Feature suites cover.
        #
        # --parallel works here because Laravel's TestDatabases concern gives
        # each worker its own schema (testing_test_1, testing_test_2, ...) and
        # migrates it, rather than the workers sharing `testing`.
        #
        # Capped at 4 to match the runner's core count: a standard ubuntu-latest
        # runner is 4 CPU, and Pest's default is already one process per core,
        # so this pins the value rather than inheriting it from whatever the
        # runner reports. Measured against a real mysql:8.4 container on 4 CPUs
        # (935 tests): 2 procs ~52s, 4 ~38s, 6 ~36s, 8 ~37s -- past 4 the gain
        # is inside the ~4s run-to-run variance, so raising it buys nothing.
        #
        # Note the constraint is CPU, NOT database connections: max_connections
        # is 151 and the whole run peaked at 10 concurrent connections. Do not
        # lower this on the theory that the service container is saturated.
        run: vendor/bin/pest --ci --parallel --processes=4 --testsuite=Unit,Feature
