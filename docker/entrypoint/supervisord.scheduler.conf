; Supervisor program set for the SCHEDULER role (CONTAINER_ROLE=scheduler).
;
; Selected by the entrypoint; see docker/entrypoint/supervisord.conf for why
; the roles are separate containers.
;
; EXACTLY ONE scheduler container may run. Unlike workers, scheduler instances
; do not divide the work between them -- each would fire every due task. The
; tasks in routes/console.php carry onOneServer() as a backstop, but that
; relies on a shared lock-capable cache and is not a licence to scale this
; service. Keep replicas at 1.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:scheduler]
; schedule:work is a long-running process that invokes schedule:run every
; minute, which is what makes a scheduler container possible without cron in
; the image. It is the documented equivalent of the * * * * * crontab entry.
;
; --no-interaction so a task that would prompt aborts instead of hanging
; forever holding the minute's run.
command=php /var/www/html/artisan schedule:work --no-interaction
user=www-data
autostart=true
autorestart=true
priority=10
numprocs=1

; schedule:work traps SIGTERM and waits for tasks it has started to finish
; rather than orphaning them mid-run.
stopsignal=TERM
stopwaitsecs=60
killasgroup=true
stopasgroup=true

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
