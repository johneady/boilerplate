; Supervisor program set for the WEB role (CONTAINER_ROLE=app).
;
; The image ships one program set per role and the entrypoint selects between
; them, so a container runs nginx + php-fpm OR a queue worker OR the scheduler
; -- never a mixture. Roles are separate containers because they scale and fail
; independently: a worker wedged on a slow job must not stop serving requests,
; and restarting the web tier must not kill a job mid-flight.
;
; See docker/entrypoint/supervisord.worker.conf and .scheduler.conf.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
