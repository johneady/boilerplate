; Supervisor program set for the QUEUE WORKER role (CONTAINER_ROLE=worker).
;
; Selected by the entrypoint; see docker/entrypoint/supervisord.conf for why
; the roles are separate containers.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:queue-worker]
; queue:work, NOT queue:listen: listen reboots the framework for every job,
; which is the right trade only in development where code must be picked up
; without a restart. A deployed worker is recycled by the flags below instead.
;
;   --queue=high,default  drains `high` completely before `default`, so an
;                         interactive job is not stuck behind a bulk backlog.
;                         Dispatch with ->onQueue('high').
;   --max-time=3600       recycle hourly; PHP processes accumulate memory, and
;                         a fresh process also picks up newly deployed code.
;   --max-jobs=1000       the same ceiling expressed in work done.
;   --memory=192          below php.ini's memory_limit (256M), so the worker
;                         exits cleanly on its own terms rather than being
;                         killed mid-job by the OOM reaper.
;   --tries / --backoff   floors for jobs that declare neither. App\Jobs\Job
;                         sets its own, which take precedence.
;   --rest=0.2            sleep between polls; on the database driver each poll
;                         is a real query, so this is the difference between a
;                         near-idle worker and one query per millisecond.
command=php /var/www/html/artisan queue:work
    --queue=high,default
    --sleep=3
    --rest=0.2
    --tries=3
    --backoff=10
    --max-time=3600
    --max-jobs=1000
    --memory=192
user=www-data
autostart=true
autorestart=true
priority=10

; One process per container. Scale by raising this (workers on the same queue
; coordinate through the database, so extra processes are safe) or by running
; more worker containers -- prefer the latter, which also survives a host loss.
numprocs=1

; SIGTERM is what `queue:work` listens for to stop after the CURRENT job rather
; than abandoning it. Supervisor's default stopsignal is TERM already; it is
; stated here because the value is load-bearing, not incidental.
stopsignal=TERM

; Give the in-flight job time to finish before supervisor escalates to SIGKILL.
; Must exceed App\Jobs\Job::$timeout (60s) or a deploy kills long jobs mid-work,
; leaving them to be retried only after retry_after elapses.
stopwaitsecs=90

; Stop the whole process group, not just the supervisor child.
killasgroup=true
stopasgroup=true

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
