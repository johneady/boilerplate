; Runtime PHP configuration for the application container.

memory_limit = 256M
max_execution_time = 60

; No file uploads in this demo beyond Livewire payloads; modest limits keep
; nginx's client_max_body_size (12M) the single effective ceiling.
upload_max_filesize = 12M
post_max_size = 14M

expose_php = off
date.timezone = UTC

; --- OPcache ---------------------------------------------------------------
; Zend OPcache is compiled into the php:8.5 base image already; it only needs
; enabling. The file_cache backs the CLI too (see /tmp/opcache in the Dockerfile
; and entrypoint).
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.file_cache = /tmp/opcache

; --- Sessions --------------------------------------------------------------
; Laravel keeps sessions in its own store, but PHP's upload-progress hook still
; writes a native session (through session.serialize_handler) for any
; multipart POST carrying PHP_SESSION_UPLOAD_PROGRESS. Nothing here uses it, so
; it is off to close CVE-2026-115560.
session.upload_progress.enabled = 0
