[www]
; Log worker output to the container's stderr so `docker logs` sees it.
catch_workers_output = yes
decorate_workers_output = no

access.log = /dev/null

; Small on purpose: this is a demo app sharing its host with others. Measured
; Laravel worker RSS is ~30-60MB, so 6 workers caps PHP at ~360MB worst case.
; Hitting the ceiling only queues requests; raising memory_limit instead risks
; the OOM reaper killing a worker mid-request.
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

pm.max_requests = 500

clear_env = no
