server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Must stay >= post_max_size in docker/php/php.ini (14M). nginx rejects an
    # oversized body with a 413 before PHP ever sees it.
    client_max_body_size 12M;
    client_body_timeout 120s;

    # Debian's nginx.conf leaves gzip_types at the built-in default of
    # text/html ONLY. Livewire replies to every filter/sort/pagination click
    # with application/json, so without this a stock list response ships
    # uncompressed. gzip_proxied any matters because this nginx always sits
    # behind Traefik in production, and the default `gzip_proxied off` would
    # skip compression for every proxied request.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/rss+xml
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Laravel's health endpoint (bootstrap/app.php), used by the image
    # HEALTHCHECK and by Dokploy/Traefik for readiness.
    location = /up {
        try_files $uri /index.php?$query_string;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Built Vite assets are content-hashed: safe to cache hard.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Static imagery shipped with the app is also content-stable.
    location ^~ /images/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;

        # Debian's fastcgi_params sets HTTP_HOST to $host, which STRIPS the
        # port. Laravel builds redirect URLs from HTTP_HOST, so a request to
        # localhost:8011 would redirect to http://localhost. $http_host keeps
        # the client's original Host header, port included.
        fastcgi_param HTTP_HOST   $http_host;
        fastcgi_param SERVER_PORT $server_port;

        fastcgi_read_timeout 120s;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Never serve dotfiles, except ACME challenges.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
