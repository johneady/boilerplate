# Security response headers, included wherever they must apply.
#
# THIS FILE EXISTS BECAUSE add_header DOES NOT MERGE. A `location` that sets
# any add_header of its own discards every add_header inherited from the
# server block -- so /build/ and /images/, which set Cache-Control, would
# silently serve without these unless the set is repeated inside them.
#
# Repeating it by hand is what rots: four lines in three places, and a change
# to one copy leaves the others stale with nothing to catch it. Including one
# file makes the repetition a single line that cannot drift.
#
# A new `location` that sets ANY add_header must add this include too.
#
# Deliberately NOT here:
#
#   Strict-Transport-Security -- belongs on the hop that speaks TLS. Traefik
#   terminates it; this server answers plain HTTP on :80 internally, where a
#   browser ignores HSTS anyway. Set it at Traefik.
#
#   Content-Security-Policy -- Filament and Livewire both emit inline scripts
#   and inline styles, so any CSP that does not break the admin panel needs
#   'unsafe-inline' for both, which gives up most of what a CSP is for while
#   still being one more thing to break on a Filament upgrade. A real one
#   means nonce-ing those inline blocks first.
#
# `always` on every line: without it nginx omits the header on error
# responses -- exactly the 4xx/5xx pages that render attacker-influenced
# input.

# Stop the browser second-guessing a declared Content-Type. config/media.php
# stores documents (.pdf, .csv, .txt, .zip) AS UPLOADED -- nothing re-encodes
# them the way images go through ProcessUploadedImage -- so this is what keeps
# a file full of markup from being sniffed into executable HTML.
add_header X-Content-Type-Options "nosniff" always;

# Clickjacking: stop another origin framing these pages invisibly and
# harvesting clicks against an authenticated Filament session. SAMEORIGIN
# rather than DENY so the app can still frame itself.
add_header X-Frame-Options "SAMEORIGIN" always;

# The default leaks the full path AND query string to whatever the user
# navigates to next. Laravel's signed URLs -- password resets, email
# verification, signed media routes -- carry their credential in the query
# string, so a full referrer hands that token to a third-party site.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Nothing here requests these, and a browser would prompt anyway; this is a
# standing default so a future dependency or embedded widget fails closed
# rather than raising a permission prompt on our domain.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
